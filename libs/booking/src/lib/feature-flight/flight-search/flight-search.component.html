@let flights = store.flightEntities();

<div class="card">
  <div class="card-header">
    <h2 class="card-title">Flight Search</h2>
  </div>

  <div class="card-body">

    <app-flight-filter
      [filter]="store.filter()"
      (searchTrigger)="flightEvents.flightFilterChanged($event)"
    >
      <div *ngIf="flights.length" class="flight-filter-info">
        {{ flights.length }} flights found!
      </div>
      <button *ngIf="flights.length" (click)="flightEvents.flightsResetTriggered()"
        class="btn btn-default flight-filter-button"
      >Reset</button>
    </app-flight-filter>

  </div>
</div>

<div class="row">
  <div *ngFor="let flight of flights" class="col-xs-12 col-sm-6 col-md-4">
    <app-flight-card
      [item]="flight"
      [selected]="store.basket()[flight.id]"
      (selectedChange)="flightEvents.basketChanged({
        id: flight.id,
        selected: $event
      })"
      (delayTrigger)="delay($event)"
    />
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h2 class="card-title">Basket</h2>
  </div>

  <div class="card-body">
    <pre>{{ store.basket() | json }}</pre>
  </div>
</div>
